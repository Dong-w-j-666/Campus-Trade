services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: campus_root_dev
      MYSQL_DATABASE: campus_trade
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - campus_trade_mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pcampus_root_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/campus_trade?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: root
      DB_PASSWORD: campus_root_dev
      APP_AUTH_SECRET: change-this-secret-before-production
    ports:
      - "8080:8080"
    volumes:
      - campus_trade_uploads:/app/uploads

volumes:
  campus_trade_mysql:
  campus_trade_uploads:
